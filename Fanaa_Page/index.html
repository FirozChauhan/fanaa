<!doctype html>
<!-- fanaa landing — plain static site, no build step.
     Author: FIROZ KHAN CHAUHAN.
     Edit the HTML/CSS/JS directly; nothing is generated. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />

    <title>FANAA — a journal for the letters you never send</title>
    <meta
      name="description"
      content="FANAA is a terminal-first daily journal. Every entry is an unsent letter — to whoever you love, kept safe in the cloud, composed in vim, in the terminal you already live in."
    />
    <meta name="author" content="FIROZ KHAN CHAUHAN" />
    <link rel="canonical" href="https://fanaa.sh/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="keywords"
      content="fanaa, journal, journaling, terminal, cli, tui, vim, unsent letters, letters, cloud sync, daily journal, local-first"
    />

    <!-- Open Graph -->
    <meta property="og:site_name" content="FANAA" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fanaa.sh/" />
    <meta property="og:title" content="FANAA — a journal for the letters you never send" />
    <meta
      property="og:description"
      content="A terminal-first daily journal. Every entry is an unsent letter — to whoever you love, kept safe in the cloud, composed in vim."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://fanaa.sh/" />
    <meta name="twitter:title" content="FANAA — a journal for the letters you never send" />
    <meta
      name="twitter:description"
      content="A terminal-first daily journal. Every entry is an unsent letter — to whoever you love, kept safe in the cloud, composed in vim."
    />

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FANAA",
        "url": "https://fanaa.sh/",
        "description": "A terminal-first daily journal. Every entry is an unsent letter — to whoever you love, kept safe in the cloud, composed in vim, in the terminal you already live in.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "macOS, Linux",
        "license": "https://opensource.org/licenses/MIT",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "FIROZ KHAN CHAUHAN" }
      }
    </script>
    <!-- Structured data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://fanaa.sh/#website",
        "name": "FANAA",
        "url": "https://fanaa.sh/",
        "inLanguage": "en",
        "publisher": { "@id": "https://fanaa.sh/#organization" }
      }
    </script>
    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://fanaa.sh/#organization",
        "name": "Fanaa",
        "url": "https://fanaa.sh/"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>

      <main id="main" class="hero">
        <div class="container">
          <div class="hero-inner">
            <h1 class="display h1">
              A journal <span class="whitespace-nowrap">for the</span><br />
              <span class="dim">letters you</span><br />
              <span class="whitespace-nowrap accent-grad">never send<span class="fg">.</span></span>

            <p class="sub">
              Every entry is an unsent letter — to whoever you love, kept safe in the cloud,
              <span class="fg">composed in vim, in the terminal you already live in.</span>
            </p>

            <div class="mt-8">
              <div class="install" id="install" role="tablist" aria-label="Install method"></div>
            </div>

            <div class="compat mt-7">
              <p class="compat-label mono-fig">compatible</p>

      <footer class="footer">

          <a class="footer-brand" href="#main" aria-label="fanaa home">

            </svg>
          </a>
          <p class="copy-pill mono-fig">فیروز چوہان</p>

    <script src="app.js"></script>
