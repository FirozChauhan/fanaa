name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release + attach assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version verified end-to-end locally (1.3.11);
          # cross-compiling all targets from one host.
          bun-version: 1.3.11

      # Fresh checkouts have no node_modules — the CLI imports workspace
      # packages (fanaa-core/sync/tui) and react (TUI), which only resolve
      # after install. Frozen lockfile: CI must match the committed bun.lock.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun's standalone compiler cross-compiles every target from one host
      # (pure JS/TS app — no native modules), so a single linux runner
      # produces all platform binaries.
      - name: Build binaries
        run: |
          set -euxo pipefail
          mkdir -p dist
          for t in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            out="dist/fanaa-${t#bun-}"
            bun build --compile --target="$t" packages/cli/src/index.ts --outfile "$out"
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum fanaa-* > SHA256SUMS
          cat SHA256SUMS

      - name: Smoke test (linux-x64)
        run: |
          chmod +x dist/fanaa-linux-x64
          expected="fanaa $(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' packages/cli/package.json | head -1)"
          test "$(dist/fanaa-linux-x64 --version)" = "$expected"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
