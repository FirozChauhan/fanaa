name: smoke

# Quick end-to-end test of the curl installer + CLI on a clean Linux box.
# Run on demand from the Actions tab, or on any push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  install-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Install via curl | sh
        run: |
          curl -fsSL https://raw.githubusercontent.com/FirozChauhan/fanaa/main/install.sh | sh
          echo "~/.local/bin:$PATH" >> "$GITHUB_PATH"

      - name: Check the binary
        run: |
          which fanaa
          fanaa --version

      - name: Write + read a letter (CLI)
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          printf 'subject line\nhello from the ci box\n' | fanaa
          fanaa ls
          fanaa today

      - name: Confirm letter landed on disk
        run: |
          export HOME="$RUNNER_TEMP/home"
          test -n "$(fanaa ls)"
          FOUND=$(find "$HOME/.fanaa" -name '*.md' | head -1)
          echo "letter file: $FOUND"
          grep -q "subject line" "$FOUND" && echo "subject OK"
          grep -qi "hello from the ci box" "$FOUND" && echo "body OK"
